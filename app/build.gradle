plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vp.thucungao'
    compileSdk 34

    defaultConfig {
        applicationId "com.vp.thucungao"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        release {
            storeFile file('../keystore.jks')
            storePassword 'thucung123'
            keyAlias 'thucung'
            keyPassword 'thucung123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
