name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ThuCungAo.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThuCungAo-apk
          path: ThuCungAo.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-v1 --cleanup-tag -y || true
          gh release create apk-v1 ThuCungAo.apk \
            --title "Thú Cưng Ảo — APK cho Android TV" \
            --notes "Game nuôi thú ảo cho bé, điều khiển bằng remote TV. Tải file ThuCungAo.apk bên dưới và cài lên tivi (Android TV 5.0+, đã thử thiết kế cho Xiaomi TV Android 14)." \
            --latest \
            --target "$GITHUB_SHA"
